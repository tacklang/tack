# The release workflow: on a push of a tag vMAJOR.MINOR.PATCH it builds
# the release of that tag, tests it and publishes it as a GitHub release,
# its tarball, SHA256SUMS, a minisign signature of each, and GitHub's
# attestation of how they were built. RELEASING.md says how to run it,
# the secrets it reads and what each step does. Every step's logic is a
# script under tools/release (and tools/get-tack.sh), which runs the
# same locally; make test-release checks them.
#
# Three jobs:
#   gate     refuses the tag before anything is built unless the release
#            key is set, the tag's commit is on main, the ci workflow
#            passed on it on a push to main, and the tag is above every
#            release (tools/release/gate.sh), with read access alone;
#   build    with read access alone and no secret, bootstraps the release
#            from the previous one, or, for the first release, from a
#            stage 1 built with Go, checks the two agree while Go still
#            can build the source, runs the Go-free test suite and
#            uploads the tarball, whose SHA-256 it takes before any test
#            runs;
#   publish  in the release environment, the only job its secrets reach,
#            checks the tarball is the one build took the SHA-256 of,
#            writes SHA256SUMS, signs, attests and creates the release, a
#            draft until every file is up and the tag is still the
#            highest.
# build and publish run in fedora:45, the image ci.yml runs in, here pinned
# by digest, the platform the suite is developed on, so the release's
# clang is the one the suite passes with; build builds and tests as ci,
# an unprivileged account, since some tests check that an unwritable path
# is refused, which root would bypass.
#
# Every action is pinned to a full commit SHA, its version beside it.
# Values from the event and from secrets reach the scripts through env
# alone, never pasted into a run script.
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The first release's stage 1 is built by tackc's reference Go
  # compiler at this tag of branch go-impl, which must be this commit.
  FROZEN_REF: go-bootstrap
  FROZEN_REF_SHA: b23d723ca6604b07daa2c49d1f00305b40e2d7f1
  # While the go-bootstrap tag can still build the source, every release
  # also builds stage 1 with Go and checks that stage 2 from it is stage 2
  # from the previous release (tools/release/crosscheck.sh). Set it to
  # false once Go can no longer build the source (see RELEASING.md).
  GO_CROSSCHECK: "true"
  # The public key the previous release is verified with, when it is not
  # the one this tag's tools/get-tack.sh holds: set only for the one
  # release that rotates the key, to the old key (see RELEASING.md).
  PREVIOUS_RELEASE_KEY: ""

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    outputs:
      previous: ${{ steps.gate.outputs.previous }}
      commit: ${{ steps.gate.outputs.commit }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gate the tag
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --quiet "https://github.com/$GITHUB_REPOSITORY.git" "+refs/heads/main:refs/remotes/origin/main"
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$commit" ]; then
            echo "the checkout is not the commit $TAG names, $commit" >&2
            exit 1
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&per_page=100" \
            --jq '.workflow_runs[] | [.head_sha, .event, .head_branch, (.conclusion // "null")] | @tsv' >"$RUNNER_TEMP/ci-runs"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' >"$RUNNER_TEMP/releases"
          previous=$(sh tools/release/gate.sh "$TAG" "$commit" origin/main "$RUNNER_TEMP/ci-runs" "$RUNNER_TEMP/releases" tools/release/minisign.pub)
          echo "previous=$previous" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          if [ -n "$previous" ]; then
            echo "bootstrapping from $previous"
          else
            echo "no release below $TAG: this is the first release, built with Go"
          fi

  build:
    needs: gate
    runs-on: ubuntu-latest
    container:
      image: fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
      # An init as PID 1, which reaps orphans, as ci.yml runs it: without
      # one a killed process's child stays a zombie and is seen as alive.
      options: --init
    permissions:
      contents: read
      # gh attestation verify of the previous release reads its
      # attestation through the API.
      attestations: read
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.dist.outputs.tarball }}
      sha256: ${{ steps.dist.outputs.sha256 }}
    steps:
      - name: Install the tools
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            git make clang compiler-rt llvm diffutils findutils which \
            xz tar gzip coreutils util-linux procps-ng minisign gh curl
          rpm -q clang llvm compiler-rt glibc tar xz
          clang --version
          minisign -v
          gh --version

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make an unprivileged account
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          useradd -m ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          runuser -u ci -- mkdir -p /home/ci/work /home/ci/tmp
          got=$(runuser -u ci -- git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          if [ "$got" != "$COMMIT" ]; then
            echo "the checkout is $got, not the commit the gate passed, $COMMIT" >&2
            exit 1
          fi

      - name: Name the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s' "$TAG" | grep -Eqx 'v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})' || {
            echo "the tag $TAG is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          echo "version=$TAG" >>"$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(runuser -u ci -- git -C "$GITHUB_WORKSPACE" log -1 --format=%ct)" >>"$GITHUB_ENV"

      - name: Fetch and verify the previous release
        if: needs.gate.outputs.previous != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.gate.outputs.previous }}
        run: |
          runuser -u ci -- env PATH="$PATH" HOME=/home/ci TMPDIR=/home/ci/tmp GH_TOKEN="$GH_TOKEN" \
            TACK_MINISIGN_KEY="$PREVIOUS_RELEASE_KEY" \
            sh tools/get-tack.sh --strict --version "$PREVIOUS" --download /home/ci/work/previous
          echo "STAGE1_TACK=/home/ci/work/previous/bin/tack" >>"$GITHUB_ENV"

      - name: Fetch tackc at the bootstrap tag
        if: needs.gate.outputs.previous == '' || env.GO_CROSSCHECK == 'true'
        run: |
          runuser -u ci -- env PATH="$PATH" HOME=/home/ci FROZEN_REF="$FROZEN_REF" FROZEN_REF_SHA="$FROZEN_REF_SHA" \
            REPO="$GITHUB_REPOSITORY" sh -c '
              set -eu
              git init -q /home/ci/work/tackc
              cd /home/ci/work/tackc
              git fetch -q --depth 1 "https://github.com/$REPO.git" "refs/tags/$FROZEN_REF:refs/tags/$FROZEN_REF"
              got=$(git rev-parse "refs/tags/$FROZEN_REF^{commit}")
              if [ "$got" != "$FROZEN_REF_SHA" ]; then
                echo "$FROZEN_REF is $got, not $FROZEN_REF_SHA" >&2
                exit 1
              fi
              git checkout -q --detach "$FROZEN_REF_SHA"'

      - name: Install Go
        if: needs.gate.outputs.previous == '' || env.GO_CROSSCHECK == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: /home/ci/work/tackc/go.mod
          cache: false

      - name: Build stage 1 with Go (first release only)
        if: needs.gate.outputs.previous == ''
        run: |
          runuser -u ci -- env PATH="$PATH" HOME=/home/ci TMPDIR=/home/ci/tmp GOCACHE=/home/ci/.cache/go-build \
            sh tools/release/go-stage1.sh /home/ci/work/tackc /home/ci/work/go-stage1/stage1
          sha256sum /home/ci/work/go-stage1/stage1.go /home/ci/work/go-stage1/stage1
          echo "STAGE1_TACK=/home/ci/work/go-stage1/stage1" >>"$GITHUB_ENV"

      - name: Build the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          runuser -u ci -- env PATH="$PATH" HOME=/home/ci TMPDIR=/home/ci/tmp \
            VERSION="$VERSION" SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            make release TACK="$STAGE1_TACK"

      - name: Take the tarball out of the tests' reach
        id: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="tack-$VERSION-linux-x86_64.tar.xz"
          install -d -m 0755 /release-dist
          install -m 0444 "bin/release/dist/$name" "/release-dist/$name"
          sha=$(sha256sum "/release-dist/$name" | cut -d' ' -f1)
          echo "tarball=$name" >>"$GITHUB_OUTPUT"
          echo "sha256=$sha" >>"$GITHUB_OUTPUT"
          echo "$sha  $name"

      - name: Check stage 2 against Go's (while Go can build the source)
        if: needs.gate.outputs.previous != '' && env.GO_CROSSCHECK == 'true'
        run: |
          runuser -u ci -- env PATH="$PATH" HOME=/home/ci TMPDIR=/home/ci/tmp GOCACHE=/home/ci/.cache/go-build sh -c '
            set -eu
            cd bin/release/tree
            sh tools/release/go-stage1.sh /home/ci/work/tackc /home/ci/work/crosscheck/stage1
            sh tools/release/crosscheck.sh . /home/ci/work/crosscheck/stage1 /home/ci/work/crosscheck/stage2'

      - name: Test the release
        run: |
          runuser -u ci -- env PATH="$PATH" HOME=/home/ci TMPDIR=/home/ci/tmp sh -c '
            set -eu
            tree=$PWD/bin/release/tree
            stage3=$tree/bin/bootstrap/stage3
            cd "$tree"
            TACK_HOME="$tree" "$stage3" --check .
            make test-corpus test-std test-unicodegen check-unicode-tables fuzz-regress test-install test-release TACK="$stage3"'

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: /release-dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    environment: release
    container:
      image: fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
      # An init as PID 1, which reaps orphans, as ci.yml runs it: without
      # one a killed process's child stays a zombie and is seen as alive.
      options: --init
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 30
    steps:
      - name: Install the tools
        run: |
          dnf -y install --setopt=install_weak_deps=False git coreutils grep minisign gh
          minisign -v
          gh --version

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check it is the tarball the build made
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: sh tools/release/check-artifact.sh dist "$TARBALL" "$SHA256"

      - name: Write SHA256SUMS
        run: sh tools/release/sums.sh dist

      - name: Sign
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
        run: sh tools/release/sign.sh dist tools/release/minisign.pub

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tack-*.tar.xz
            dist/SHA256SUMS

      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Tack $VERSION" --notes "Tack $VERSION. See the README's Installing section to verify and install it." \
            dist/tack-*.tar.xz dist/tack-*.tar.xz.minisig dist/SHA256SUMS dist/SHA256SUMS.minisig

      - name: Publish it, the latest only while its tag is the highest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' >"$RUNNER_TEMP/releases"
          sh tools/release/previous.sh "$VERSION" <"$RUNNER_TEMP/releases" >/dev/null
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
