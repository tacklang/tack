# ci checks the port on every push to main with its own suite, the one
# that needs no Go: the bootstrap, stage 2 and stage 3 the same bytes,
# then the corpus, the run records, the spec, std's tests, the Unicode
# tables, the fuzz regressions and the library check of the tree, all run
# with stage 3. Go builds stage 1 only, from tackc at the go-bootstrap
# tag, the frozen compiler with this branch's runtime, as the first
# release does; nothing Go builds is shipped or tested. The full porttest,
# which compares the port with the frozen Go compiler, is run before a
# release, not here (see RELEASING.md).
#
# It runs in a Fedora container, the platform the suite is developed on,
# as an unprivileged user, since several checks require an unwritable
# path to be refused, which root would bypass.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
      # An init as PID 1 reaps the processes the checks orphan; the
      # container's default PID 1 does not, so a killed process would stay
      # a zombie and the checks that a run left nothing behind would fail.
      options: --init
    steps:
      - name: Install the tools
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            git make clang compiler-rt llvm diffutils findutils which \
            xz tar gzip coreutils util-linux procps-ng
          clang --version

      - name: Check out the port
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tack
          persist-credentials: false

      - name: Check out tackc at go-bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: go-bootstrap
          path: tackc
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tackc/go.mod
          cache: false

      - name: Make an unprivileged user
        run: |
          useradd -m ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          nproc; free -g

      - name: Build stage 1 with the frozen compiler
        run: |
          runuser -u ci -- env PATH="$PATH" HOME=/home/ci GOCACHE=/home/ci/.cache/go-build \
            sh -c 'cd tackc && make port-go-bin TACK_PORT=../tack &&
              cd ../tack && mkdir -p bin &&
              TACK_HOME=. TACK_CACHE="$PWD/bin/stage1-cache" ../tackc/bin/port-go/tack -O3 --out bin/stage1 ./driver &&
              sha256sum bin/stage1'

      - name: Bootstrap, stage 2 and stage 3 the same bytes
        run: runuser -u ci -- sh -c 'cd tack && make bootstrap TACK="$PWD/bin/stage1"'

      - name: Library check of the tree
        run: runuser -u ci -- sh -c 'cd tack && TACK_HOME=. bin/bootstrap/stage3 --check .'

      - name: Corpus, run records and the spec
        run: runuser -u ci -- sh -c 'cd tack && make test-corpus TACK="$PWD/bin/bootstrap/stage3"'

      - name: std's tests
        run: runuser -u ci -- sh -c 'cd tack && make test-std TACK="$PWD/bin/bootstrap/stage3"'

      - name: Unicode tables and their generator
        run: runuser -u ci -- sh -c 'cd tack && make check-unicode-tables test-unicodegen TACK="$PWD/bin/bootstrap/stage3"'

      - name: Fuzz regressions
        run: runuser -u ci -- sh -c 'cd tack && make fuzz-regress TACK="$PWD/bin/bootstrap/stage3"'
